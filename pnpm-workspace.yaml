# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.3.2
  '@tanstack/react-query': ^5.101.2
  '@types/node': ^25.9.5
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^5.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.42.2
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.2
  tsx: ^4.23.0
  vite: ^7.3.6
  wouter: ^3.10.0
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # esbuild-plugin-pino (used by the api-server build) and vite must resolve
  # to a single, mutually compatible esbuild version across the workspace.
  # 0.27.x satisfies vite's `^0.27.0` peer requirement and esbuild-plugin-pino
  # only needs the stable esbuild plugin API, which hasn't changed across
  # 0.25 -> 0.28, so pinning here keeps every workspace package in lockstep.
  esbuild: "0.27.3"
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.23.0"
  # NOTE: we intentionally do NOT exclude any platform-specific optional
  # dependencies (e.g. @rollup/rollup-win32-x64-msvc, @esbuild/win32-x64,
  # lightningcss-win32-x64-msvc, @tailwindcss/oxide-win32-x64-msvc, etc).
  # esbuild, rollup, lightningcss and @tailwindcss/oxide all ship the correct
  # native binary for the current OS/arch as an optionalDependency, and pnpm
  # automatically installs only the one matching the machine running
  # `pnpm install`. Excluding "other" platforms (as this workspace used to do
  # for a single target platform) breaks installs on every other OS,
  # including Windows and macOS — do not reintroduce those overrides.

allowBuilds:
  esbuild: true
