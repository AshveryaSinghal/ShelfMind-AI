name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # ultralytics/langchain are heavy and not needed for the unit-test
          # suite (detection is stubbed in tests, see test_dashboard.py) --
          # install everything except those to keep CI fast; swap this for
          # `pip install -r requirements.txt` if you add tests that need
          # real YOLO inference.
          pip install fastapi uvicorn python-multipart python-dotenv numpy \
                       opencv-python-headless Pillow pillow-heif pytest pytest-cov \
                       "python-jose[cryptography]" passlib==1.7.4 bcrypt==4.0.1 httpx

      - name: Run backend tests with coverage
        run: python -m pytest shelfmind/tests/ -v --cov=shelfmind --cov-report=term-missing
        env:
          SHELFMIND_SECRET_KEY: ci-only-test-secret-key

  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build all workspace packages
        run: pnpm run build
