[project]
name = "shelfmind-backend"
version = "0.1.0"
description = "ShelfMind Python backend -- YOLO11 shelf detection, deterministic analytics/health-score/restocking-recommendation engine, scan history, and LLM assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.0.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "Pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "ultralytics>=8.2.0",
    "PyYAML>=6.0",
    "google-generativeai>=0.8.3",
    "langchain-core>=0.2.0",
    "langchain-ollama>=0.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "APScheduler>=3.10.4",
    "tzdata>=2024.1",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
]

# Ultralytics pulls in torch/torchvision transitively; on Linux this
# maps just those two packages to the CPU-only PyTorch wheel index so a
# `uv sync` doesn't pull multi-GB CUDA wheels for a CPU inference backend.
[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
